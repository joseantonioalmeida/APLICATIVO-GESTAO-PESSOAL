server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # O index e o service worker nunca ficam em cache (atualizações do app).
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-store"; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-store"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
